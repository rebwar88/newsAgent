name: News Agent Reliability Tests
on:
  push:
    branches:
      - main
      - fix/news-agent-reliability
      - fix/sorani-translation-quality-20261122
      - feature/apify-keyword-prefilter-20261122
      - feature/iraq-iran-international-sources-20261123
    paths:
      - 'main.py'
      - 'test_reliability.py'
      - 'test_sorani_quality.py'
      - 'sorani_quality.py'
      - 'apify_facebook.py'
      - 'facebook_news_keywords.json'
      - 'test_apify_keyword_filter.py'
      - 'international_sources.py'
      - 'test_international_sources.py'
      - '.github/workflows/reliability_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py sorani_quality.py apify_facebook.py international_sources.py test_reliability.py test_sorani_quality.py test_apify_keyword_filter.py test_international_sources.py
      - run: python -m unittest -v test_reliability.py test_sorani_quality.py test_apify_keyword_filter.py test_international_sources.py
