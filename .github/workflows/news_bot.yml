name: Automated News Workflow

on:
  push:
    branches: [main]
    paths-ignore:
      - 'seen_urls.json'
      - 'publication_state.json'
  schedule:
    # Check every 5 minutes, 24 hours a day (GitHub may delay scheduled jobs).
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: news-agent-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute News Automation Script
        env:
          PUBLISH_ENABLED: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit and Push Seen News Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_urls.json publication_state.json
          git commit -m "chore: update seen news cache [skip ci]" || echo "No new news to commit"
          git push
