name: Automated News Workflow

on:
  push:
    branches: [main]
    paths-ignore:
      - 'seen_urls.json'
      - 'publication_state.json'
      - 'docs/status.json'
  schedule:
    # Check every 5 minutes, 24 hours a day (GitHub may delay scheduled jobs).
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: news-agent-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile main.py run_and_report.py dashboard_export.py

      - name: Execute News Automation Script
        env:
          PUBLISH_ENABLED: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_LOG_CHAT_ID: ${{ secrets.TELEGRAM_LOG_CHAT_ID }}
        run: |
          python run_and_report.py

      - name: Export dashboard telemetry
        if: always()
        run: python dashboard_export.py

      - name: Upload detailed execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsagent-log-${{ github.run_id }}
          path: newsagent_run.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and Push Seen News Cache
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_urls.json publication_state.json
          if [ -f docs/status.json ]; then git add docs/status.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen news cache [skip ci]"
            git push
          fi
