name: News Agent Reliability Tests
on:
  push:
    branches:
      - main
      - fix/news-agent-reliability
    paths:
      - 'main.py'
      - 'test_reliability.py'
      - '.github/workflows/reliability_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py test_reliability.py
      - run: python -m unittest -v test_reliability.py
